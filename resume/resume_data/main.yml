academic_projects:
  - name: "Algorithm Design and Analysis Project - Runtime Analysis and Hyperparameter Tuning of Hybrid Sort"
    url: / https://github.com/GabeeDeVera/hybrid-sort-hyperparameter-analysis/tree/main -> REDACT_LINK
    affiliation: Nanyang Technological University, Singapore
    startDate: 2026-09-04
    endDate: 2026-09-18
    highlights:
      - Modeled runtime behavior of hybrid sort and applied unconstrained continuous optimization techniques, resulting in a general theoretical model for optimizing runtime of hybrid sort 
      - Performed a two-variable regression analysis using a custom gradient descent pipeline in Python and TensorFlow inspired by machine learning techniques to compute optimal hybrid sort hyperparameter values over a dataset of empirical runtime data, decreasing sorting time by 7.6% for arrays with 10 million elements
      - Wrote a 10-slide strong induction proof of the optimality of some set of hyperparameter values, providing theoretical airtightness in the analysis
  - name: "Introduction to Computational Thinking & Programming Project - Simulated Annealing Team Allocator"
    url: / https://github.com/GabeeDeVera/simulated-annealing-team-allocator/tree/main -> REDACT_LINK
    affiliation: Nanyang Technological University, Singapore
    startDate: 2025-10-15
    endDate: 2025-11-23
    highlights:
      - Reformulated diverse team allocation as a discrete computational optimization problem over a constructed feature space and applied Simulated Annealing in Python on 6000 rows of student educational records to achieve groupings with near-mathematically-optimal diversity
      - Proved that the formulated optimization problem is in NP-hard (nondeterministic polynomial time---hard), rigorously supporting the use of heuristic methodologies

